[workspace]
resolver = "3"
members = ["crates/lineshapes", "crates/lineshapes-py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Harlan D Heilman"]
license = "BSD-3-Clause-LBNL"
repository = "https://github.com/ALS-RSOXS/lineshapes"
homepage = "https://als-rsoxs.github.io/lineshapes"

[workspace.dependencies]
num-complex = "0.4"
lineshapes = { path = "crates/lineshapes", version = "0.1.0", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
# strip must stay off: on this macOS toolchain stripping corrupts the extension
# ("mis-aligned LINKEDIT string pool" at import).
strip = false
