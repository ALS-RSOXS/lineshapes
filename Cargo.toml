[package]
name = "lineshapes_rs"
version = "0.1.0"
edition = "2024"
description = "Fast composable optical-constant models: analytic KK-paired lineshape peaks + continuum."

[lib]
name = "_core"
# cdylib for the Python extension, rlib so other Rust crates (e.g. refloxide) can depend on it.
crate-type = ["cdylib", "rlib"]

[features]
default = ["python", "parallel"]
python = ["dep:pyo3", "dep:numpy"]
parallel = ["dep:rayon"]

[dependencies]
num-complex = "0.4"
errorfunctions = "0.2"
rayon = { version = "1.10", optional = true }
pyo3 = { version = "0.28.2", features = ["extension-module", "abi3-py312"], optional = true }
numpy = { version = "0.28", optional = true }

[profile.release]
strip = false
# strip must stay off: on this macOS toolchain stripping corrupts the extension
# ("mis-aligned LINKEDIT string pool" at import).
lto = "fat"
codegen-units = 1
