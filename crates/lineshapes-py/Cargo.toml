[package]
name = "lineshapes-py"
description = "Python bindings (PyO3) for the `lineshapes` crate; built by maturin as lineshapes._core."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]
# An extension module cannot link into a test binary; the logic is tested in `lineshapes` and pytest.
test = false
doctest = false

[features]
default = ["parallel"]
parallel = ["lineshapes/parallel"]

[dependencies]
lineshapes.workspace = true
pyo3 = { version = "0.28.2", features = ["extension-module", "abi3-py312"] }
numpy = "0.28"
