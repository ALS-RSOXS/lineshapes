[project]
name = "lineshapes"
dynamic = ["version"]  # single source of truth: [workspace.package] version in Cargo.toml
description = "Fast composable optical-constant models: analytic Kramers-Kronig-paired lineshape peaks plus a continuum."
readme = "README.md"
license = "BSD-3-Clause-LBNL"
license-files = ["LICENSE", "COPYRIGHT"]
authors = [
    { name = "Harlan D Heilman", email = "73567020+HarlanHeilman@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.urls]
Repository = "https://github.com/ALS-RSOXS/lineshapes"
Documentation = "https://als-rsoxs.github.io/lineshapes"

[project.optional-dependencies]
# Needed only to run the example scripts (fitting + figures); the library itself needs just numpy.
examples = ["scipy>=1.13", "matplotlib>=3.9"]

[dependency-groups]
dev = [
    "pytest>=8",
    "kkcalc2",
    "scipy>=1.13",
    "matplotlib>=3.9",
]
# Docs build on Python >= 3.13 (the mkdocs_rsoxs theme requires it): make docs uses its own env.
docs = [
    "mkdocs_rsoxs>=0.1.3; python_version >= '3.13'",
    "mkdocstrings-python>=2.0.1",
    "pymdown-extensions>=10",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[tool.uv.sources]
# Single pinned kkcalc version for KK validation (same commit lr-optical-models locks).
kkcalc2 = { git = "https://github.com/xraysoftmat/kkcalc.git", rev = "e750040f96fded5cf8044282d6db9a84e96d353c" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "kkcalc: compares against kkcalc2 (slower)",
    "speed: timing comparison of a backend against the Python reference",
]
filterwarnings = ["ignore::UserWarning:kkcalc2.*"]

[tool.maturin]
module-name = "lineshapes._core"
python-packages = ["lineshapes"]
python-source = "python"
manifest-path = "crates/lineshapes-py/Cargo.toml"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "crates/**/*.rs" }, { file = "**/Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"
